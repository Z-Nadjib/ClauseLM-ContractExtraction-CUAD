run_name: qwen2.5-1.5b-cuad-qlora
base_model: unsloth/Qwen2.5-1.5B-Instruct
output_dir: outputs/qwen2.5-1.5b-cuad
max_seq_length: 4096
load_in_4bit: true
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
eval_steps: 60
logging_steps: 10
seed: 42
lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
